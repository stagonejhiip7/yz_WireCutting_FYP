<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wire Cutter Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
      padding: 1rem;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00ff88;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
      flex-shrink: 0;
    }

    .dot.error { background: #ff4444; animation: none; }
    .dot.loading { background: #ffaa00; }
    .dot.stale { background: #ffaa00; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 2rem;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .ip-display {
      font-size: 1.4rem;
      color: #00ff88;
      letter-spacing: 0.05em;
      margin: 1rem 0 1.5rem;
      min-height: 2rem;
      word-break: break-all;
    }

    .ip-display.error { color: #ff4444; font-size: 1rem; }
    .ip-display.stale { color: #ffaa00; }

    .btn {
      display: inline-block;
      padding: 0.7rem 1.8rem;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: #00ff88;
      color: #0f1117;
      font-weight: bold;
    }

    .btn-primary:hover { background: #00cc6a; }
    .btn-primary:disabled { background: #1f4a36; color: #555; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: #888;
      border: 1px solid #2a2d3a;
      margin-left: 0.5rem;
    }

    .btn-ghost:hover { color: #e0e0e0; border-color: #444; }

    .countdown {
      margin-top: 1.2rem;
      font-size: 0.78rem;
      color: #444;
      min-height: 1rem;
    }

    .note {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #ffaa00;
      line-height: 1.5;
    }

    .divider {
      border: none;
      border-top: 1px solid #2a2d3a;
      margin: 1.8rem 0;
    }

    .updated {
      font-size: 0.75rem;
      color: #555;
      line-height: 1.6;
    }

    .hint {
      font-size: 0.7rem;
      color: #3a3d4a;
      margin-top: 0.6rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ Wire Cutter Portal</h1>

    <div class="status-line">
      <span class="dot loading" id="dot"></span>
      <span id="status-text">Looking for the machine...</span>
    </div>

    <div class="ip-display" id="ip-display">—</div>

    <button class="btn btn-primary" id="connect-btn" disabled onclick="connectNow()">
      Connect
    </button>
    <button class="btn btn-ghost" id="refresh-btn" onclick="fetchIP()">
      Refresh
    </button>

    <div class="countdown" id="countdown"></div>
    <div class="note" id="note" style="display:none"></div>

    <hr class="divider"/>
    <div class="updated" id="last-updated">Last seen: —</div>
    <div class="hint">You must be on the same network as the machine.</div>
  </div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────
    // Both come from your Supabase project: Settings -> API Keys.
    // Use the PUBLIC key - labelled either "anon public" (a long JWT
    // starting "eyJ") or "publishable" (starting "sb_publishable_").
    // Never the secret / service_role key.
    //
    // This page is public, so whatever you put here is public too.
    // supabase_schema.sql limits this key to reading device_status and
    // appending log rows - it cannot read student emails or job history.
    const SUPABASE_URL      = "https://kkcafoottgitdemorykh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_6BjS43xIvQU4EODO4fmMig_9s29zwyt";

    const ESP32_PATH = "/";      // path to open on the machine

    // The machine republishes every 10 minutes. If the newest timestamp is
    // older than this, it's almost certainly switched off - so we show the
    // address but don't send anyone to it automatically.
    const STALE_AFTER_MS = 15 * 60 * 1000;
    // ────────────────────────────────────────────────────────

    let currentIP = null;
    let countdownTimer = null;

    // Supabase has two generations of public key and they want different
    // headers. The older "anon" key is a JWT and is normally sent as a
    // Bearer token as well. The newer sb_publishable_... keys must NOT be:
    // Supabase would try to parse the Bearer value as a JWT and reject the
    // request with "Invalid JWT". Every JWT starts "eyJ", which is a
    // reliable way to tell them apart.
    function authHeaders() {
      const h = { "apikey": SUPABASE_ANON_KEY };
      if (SUPABASE_ANON_KEY.startsWith("eyJ")) {
        h["Authorization"] = "Bearer " + SUPABASE_ANON_KEY;
      }
      return h;
    }

    async function fetchIP() {
      setLoading();
      clearInterval(countdownTimer);

      if (SUPABASE_URL.includes("YOUR-PROJECT-REF")) {
        setError("Portal not configured - set SUPABASE_URL and SUPABASE_ANON_KEY in this page.");
        return;
      }

      try {
        const url = `${SUPABASE_URL}/rest/v1/device_status`
                  + `?id=eq.1&select=ip,last_seen,uptime_s`;

        const res = await fetch(url, { headers: authHeaders(), cache: "no-store" });

        if (!res.ok) throw new Error(`Database returned ${res.status}`);

        // PostgREST always answers with an array, even for one row.
        const rows = await res.json();
        if (!Array.isArray(rows) || rows.length === 0) {
          throw new Error("No device row yet - has the machine ever been switched on?");
        }

        const { ip, last_seen } = rows[0];
        if (!ip) throw new Error("The machine hasn't reported an address yet");

        currentIP = ip;

        const seenAt = last_seen ? new Date(last_seen) : null;
        const age    = seenAt ? (Date.now() - seenAt.getTime()) : Infinity;

        if (age > STALE_AFTER_MS) {
          setStale(ip, seenAt, age);      // show it, but don't auto-redirect
        } else {
          setReady(ip, seenAt);
          scheduleRedirect(ip);
        }

      } catch (e) {
        setError(e.message);
      }
    }

    // ---- UI states ----

    function setLoading() {
      dot("loading");
      text("status-text", "Looking for the machine...");
      const el = document.getElementById("ip-display");
      el.className = "ip-display";
      el.textContent = "—";
      document.getElementById("connect-btn").disabled = true;
      text("countdown", "");
      hideNote();
    }

    function setReady(ip, seenAt) {
      dot("ready");
      text("status-text", "Machine online");
      const el = document.getElementById("ip-display");
      el.className = "ip-display";
      el.textContent = ip;
      document.getElementById("connect-btn").disabled = false;
      showLastSeen(seenAt);
      hideNote();
    }

    function setStale(ip, seenAt, age) {
      dot("stale");
      text("status-text", "Machine looks switched off");
      const el = document.getElementById("ip-display");
      el.className = "ip-display stale";
      el.textContent = ip;
      // Still let them try — it might just have lost WiFi briefly.
      document.getElementById("connect-btn").disabled = false;
      text("countdown", "");
      showLastSeen(seenAt);
      showNote(
        `No word from the machine for ${humanAge(age)}. `
        + `That address was its last known one — you can still try it, `
        + `but it may not answer.`
      );
    }

    function setError(msg) {
      dot("error");
      text("status-text", "Could not reach the database");
      const el = document.getElementById("ip-display");
      el.className = "ip-display error";
      el.textContent = msg;
      document.getElementById("connect-btn").disabled = true;
      text("countdown", "Retrying in 10s...");
      hideNote();
      clearInterval(countdownTimer);
      setTimeout(fetchIP, 10000);
    }

    // ---- helpers ----

    function dot(state) {
      const el = document.getElementById("dot");
      el.className = "dot";
      if (state !== "ready") el.classList.add(state);
    }

    function text(id, value) {
      document.getElementById(id).textContent = value;
    }

    function showNote(msg) {
      const el = document.getElementById("note");
      el.textContent = msg;
      el.style.display = "block";
    }

    function hideNote() {
      document.getElementById("note").style.display = "none";
    }

    function showLastSeen(seenAt) {
      text("last-updated",
           seenAt ? "Last seen: " + seenAt.toLocaleString() : "Last seen: unknown");
    }

    function humanAge(ms) {
      const mins = Math.floor(ms / 60000);
      if (mins < 60)   return `${mins} minute${mins === 1 ? "" : "s"}`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24)    return `${hrs} hour${hrs === 1 ? "" : "s"}`;
      const days = Math.floor(hrs / 24);
      return `${days} day${days === 1 ? "" : "s"}`;
    }

    function scheduleRedirect(ip) {
      let secs = 3;
      text("countdown", `Redirecting in ${secs}s...`);
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        secs--;
        if (secs <= 0) {
          clearInterval(countdownTimer);
          text("countdown", "Connecting...");
          go(ip);
        } else {
          text("countdown", `Redirecting in ${secs}s...`);
        }
      }, 1000);
    }

    function connectNow() {
      if (currentIP) {
        clearInterval(countdownTimer);
        go(currentIP);
      }
    }

    function go(ip) {
      window.location.href = `http://${ip}${ESP32_PATH}`;
    }

    fetchIP();
  </script>
</body>
</html>
